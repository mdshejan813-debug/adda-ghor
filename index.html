
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আড্ডা ঘর - শেরপুর</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri',sans-serif}</style>
</head>
<body class="bg-[#f0f2f5] pb-20">
<!-- Header -->
<div class="bg-[#15803d] text-white sticky top-0 z-50 shadow">
<div class="flex justify-between items-center p-3">
<h1 class="text-2xl font-bold">আড্ডা ঘর</h1>
<div class="flex gap-3 text-xl"><span>💬</span><span>🔔</span></div>
</div>
</div>

<!-- Welcome Card -->
<div class="bg-white m-2 p-4 rounded-2xl shadow text-center">
<h2 class="font-bold text-lg">🎉 আড্ডা ঘর - শেরপুর বগুড়া</h2>
<p class="text-sm text-gray-600">আমাদের নিজের ফেসবুক! সবাই জয়েন করো</p>
<button onclick="document.getElementById('postBox').focus()" class="mt-3 bg-[#16a34a] text-white px-6 py-2 rounded-full font-semibold">What's on your mind? লেখো</button>
</div>

<!-- Stories -->
<div class="bg-white p-3 flex gap-3 overflow-x-auto">
<div class="text-center min-w-[60px]"><div class="w-14 h-14 rounded-full bg-green-500 flex items-center justify-center text-white text-xl">+</div><p class="text-xs mt-1">Add Story</p></div>
<div class="text-center min-w-[60px]"><img src="https://i.pravatar.cc/100?img=1" class="w-14 h-14 rounded-full border-2 border-green-500"><p class="text-xs mt-1">Shejan</p></div>
<div class="text-center min-w-[60px]"><img src="https://i.pravatar.cc/100?img=5" class="w-14 h-14 rounded-full border-2 border-green-500"><p class="text-xs mt-1">Rahim</p></div>
<div class="text-center min-w-[60px]"><img src="https://i.pravatar.cc/100?img=8" class="w-14 h-14 rounded-full border-2 border-green-500"><p class="text-xs mt-1">Karim</p></div>
</div>

<!-- Create Post -->
<div class="bg-white m-2 p-3 rounded-2xl shadow">
<div class="flex gap-2">
<img src="https://i.pravatar.cc/100?img=1" class="w-10 h-10 rounded-full">
<textarea id="postBox" placeholder="মন খুলে কিছু লেখো, শেজান ভাই..." class="flex-1 bg-gray-100 rounded-2xl p-3 text-sm outline-none resize-none"></textarea>
</div>
<div class="flex justify-between mt-3">
<div class="flex gap-4 text-sm text-gray-600"><span>📷 Photo</span><span>🎥 Video</span></div>
<button onclick="addPost()" class="bg-[#15803d] text-white px-5 py-1.5 rounded-full text-sm font-bold">Post</button>
</div>
</div>

<!-- Feed -->
<div id="feed">
<!-- Post 1 -->
<div class="bg-white mt-2 shadow">
<div class="p-3 flex gap-2 items-center">
<img src="https://i.pravatar.cc/100?img=1" class="w-10 h-10 rounded-full">
<div><p class="font-bold text-sm">Md Shejan Sheikh</p><p class="text-xs text-gray-500">শেরপুর, বগুড়া • 2h</p></div>
</div>
<p class="px-3 pb-2 text-[15px]">জীবনটা গল্পের মতো সুন্দর বানাতে চাই। সবাইকে আড্ডা ঘরে স্বাগতম! ❤️ #Sherpur #AddaGhor</p>
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=700" class="w-full">
<div class="flex justify-around p-2 border-t text-sm text-gray-600">
<button onclick="like(this)" class="flex-1">👍 Like (<span>12</span>)</button>
<button class="flex-1">💬 Comment</button>
<button class="flex-1">↗️ Share</button>
</div>
</div>
</div>

<!-- Bottom Nav -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 text-xs">
<div class="text-center text-green-700 font-bold">🏠<br>Home</div>
<div class="text-center">👥<br>Friends</div>
<div class="text-center">💬<br>Chats</div>
<div class="text-center">🔖<br>Saved</div>
<div class="text-center">👤<br>Profile</div>
</div>

<script>
function addPost(){
 let t=document.getElementById('postBox').value;
 if(!t) return;
 let feed=document.getElementById('feed');
 let div=document.createElement('div');
 div.className='bg-white mt-2 shadow';
 div.innerHTML=`<div class="p-3 flex gap-2 items-center"><img src="https://i.pravatar.cc/100?img=1" class="w-10 h-10 rounded-full"><div><p class="font-bold text-sm">Md Shejan Sheikh</p><p class="text-xs text-gray-500">Just now</p></div></div><p class="px-3 pb-3 text-[15px]">${t}</p><div class="flex justify-around p-2 border-t text-sm text-gray-600"><button onclick="like(this)" class="flex-1">👍 Like (<span>0</span>)</button><button class="flex-1">💬 Comment</button><button class="flex-1">↗️ Share</button></div>`;
 feed.prepend(div);
 document.getElementById('postBox').value='';
}
function like(btn){
 let span=btn.querySelector('span');
 let n=parseInt(span.innerText)+1;
 span.innerText=n;
 btn.classList.add('text-green-600','font-bold');
}
</script>
</body>
</html>
